[project]
name = "shtab-direct-ai-control"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "shtab-core>=0.1.0",
    "alembic>=1.20",
    "cryptography>=46",
    "httpx>=0.28,<1",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.20,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shtab_direct_ai_control"]

[tool.hatch.build.targets.wheel.force-include]
"manifest.json" = "shtab_direct_ai_control/manifest.json"
"frontend" = "shtab_direct_ai_control/frontend"
